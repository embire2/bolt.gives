name: Cloudflare Pages Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages-production
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest

    steps:
      - name: Check production deployment secrets
        id: check-secrets
        run: |
          if [[ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" && -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.check-secrets.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Setup pnpm
        if: steps.check-secrets.outputs.configured == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 9.14.4
          run_install: false

      - name: Setup Node.js
        if: steps.check-secrets.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install dependencies
        if: steps.check-secrets.outputs.configured == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build production bundle
        if: steps.check-secrets.outputs.configured == 'true'
        env:
          NODE_OPTIONS: --max-old-space-size=6142
          NODE_ENV: production
        run: pnpm run build

      - name: Deploy to Cloudflare Pages
        if: steps.check-secrets.outputs.configured == 'true'
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NO_COLOR: '1'
        run: |
          set -o pipefail
          deploy_log="$(mktemp)"
          pnpm exec wrangler pages deploy build/client \
            --project-name bolt-gives \
            --branch main \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "release: $GITHUB_SHA" \
            --commit-dirty=false | tee "$deploy_log"

          deployment_url="$(grep -Eo 'https://[a-z0-9-]+\.bolt-gives\.pages\.dev' "$deploy_log" | tail -n 1)"
          if [[ -z "$deployment_url" ]]; then
            echo "Wrangler completed without reporting a deployment URL." >&2
            exit 1
          fi

          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Smoke test deployed site
        if: steps.check-secrets.outputs.configured == 'true'
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          echo "Production URL: $DEPLOYMENT_URL"
          for attempt in $(seq 1 24); do
            if curl --connect-timeout 10 --max-time 20 -fLsS "$DEPLOYMENT_URL" -o /tmp/pages.html &&
              grep -q "bolt.gives" /tmp/pages.html; then
              echo "Production deployment is ready."
              exit 0
            fi

            echo "Deployment is not ready (attempt $attempt/24); retrying in 5 seconds."
            sleep 5
          done

          echo "Production deployment did not become ready: $DEPLOYMENT_URL" >&2
          exit 1

      - name: Production deployment not configured
        if: steps.check-secrets.outputs.configured == 'false'
        run: |
          echo "Cloudflare production deployment is not configured for this repository."
          echo "Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to enable automatic Pages releases."

      - name: Workflow summary
        run: |
          if [[ "${{ steps.check-secrets.outputs.configured }}" == "true" ]]; then
            echo "Production Pages deployment completed."
            echo "URL: ${{ steps.deploy.outputs.url }}"
          else
            echo "Production Pages deployment skipped because Cloudflare repository secrets are not configured."
          fi
