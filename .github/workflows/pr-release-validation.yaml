name: PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches:
      - main

permissions:
  actions: read
  contents: read
  pull-requests: write
  checks: write

jobs:
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for required workflows on this exact PR head
        uses: actions/github-script@v7
        timeout-minutes: 30
        with:
          script: |
            // PR jobs may be attached to a synthetic merge SHA. Workflow runs
            // retain the actual head SHA, so do not search for an absent job name.
            const required = ['CI/CD', 'Security Analysis', 'Installer Recovery'];
            const sha = context.payload.pull_request.head.sha;
            const deadline = Date.now() + 28 * 60 * 1000;
            while (Date.now() < deadline) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                ...context.repo, head_sha: sha, event: 'pull_request', per_page: 100
              });
              const current = required.map(name => data.workflow_runs
                .filter(run => run.name === name && run.head_sha === sha)
                .sort((a, b) => b.id - a.id)[0]);
              const failed = current.filter(run => run?.status === 'completed' && run.conclusion !== 'success');
              if (failed.length) {
                core.setFailed(failed.map(run => `${run.name}: ${run.conclusion} (${run.html_url})`).join('\n'));
                return;
              }
              if (current.every(run => run?.status === 'completed' && run.conclusion === 'success')) {
                core.info(`Required workflows passed on ${sha}`);
                return;
              }
              core.info(`Waiting: ${required.filter((name, index) => current[index]?.conclusion !== 'success').join(', ')}`);
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            core.setFailed('Timed out waiting for the exact-head required workflows.');

  validate-release:
    name: Release Validation
    runs-on: ubuntu-latest
    needs: quality-gates

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate PR Labels
        run: |
          if [[ "${{ contains(github.event.pull_request.labels.*.name, 'stable-release') }}" == "true" ]]; then
            echo "✓ PR has stable-release label"
            
            # Check version bump labels
            if [[ "${{ contains(github.event.pull_request.labels.*.name, 'major') }}" == "true" ]]; then
              echo "✓ Major version bump requested"
            elif [[ "${{ contains(github.event.pull_request.labels.*.name, 'minor') }}" == "true" ]]; then
              echo "✓ Minor version bump requested"
            else
              echo "✓ Patch version bump will be applied"
            fi
          else
            echo "This PR doesn't have the stable-release label. No release will be created." 
          fi

      - name: Check breaking changes
        if: contains(github.event.pull_request.labels.*.name, 'major')
        run: |
          echo "⚠️ This PR contains breaking changes and will trigger a major release."

      - name: Validate changelog entry
        if: contains(github.event.pull_request.labels.*.name, 'stable-release')
        run: |
          if ! test -s CHANGELOG.md; then
            echo "❌ No changelog entry found for PR #${{ github.event.pull_request.number }}"
            echo "Please add the release entry to CHANGELOG.md"
            exit 1
          else
            echo "✓ Changelog entry found"
          fi

  security-review:
    name: Security Review Required
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'security')

    steps:
      - name: Check security label
        run: |
          echo "🔒 This PR has security implications and requires additional review"
          echo "Ensure a security team member has approved this PR before merging"
