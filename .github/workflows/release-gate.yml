name: Release Gate

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.14.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start local runtime stack
        run: |
          pnpm run prepare:devvars
          node scripts/runtime-server.mjs > /tmp/bolt-runtime.log 2>&1 &
          echo $! > /tmp/bolt-runtime.pid
          node scripts/collaboration-server.mjs > /tmp/bolt-collab.log 2>&1 &
          echo $! > /tmp/bolt-collab.pid
          node scripts/start-pages-production.mjs --ip 127.0.0.1 --port 8788 > /tmp/bolt-app.log 2>&1 &
          echo $! > /tmp/bolt-app.pid

      - name: Wait for local release smoke target
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8788/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Local Pages target never became ready."
          exit 1

      - name: Run release gate against local production artifact
        run: pnpm run gate:release
        env:
          RELEASE_GATE_DOMAINS: http://127.0.0.1:8788
          RELEASE_GATE_SCREENSHOT_BASE_URL: http://127.0.0.1:8788

      - name: Verify FREE provider startup label on local release target
        run: BASE_URL=http://127.0.0.1:8788 pnpm run e2e:free-startup

      - name: Run provider-backed release smoke when configured
        if: ${{ env.OPENAI_API_KEY != '' }}
        run: BASE_URL=http://127.0.0.1:8788 E2E_PROVIDER=OpenAI E2E_MODEL=gpt-5.4 pnpm run smoke:live

      - name: Report skipped provider-backed release smoke
        if: ${{ env.OPENAI_API_KEY == '' }}
        run: echo "Provider-backed release smoke skipped because OPENAI_API_KEY is not configured for GitHub Actions."

      - name: Run post-deploy asset health check against local release target
        run: BASE_URLS=http://127.0.0.1:8788 pnpm run health:postdeploy

      - name: Dump local runtime logs on failure
        if: failure()
        run: |
          echo "--- runtime ---"
          cat /tmp/bolt-runtime.log || true
          echo "--- collab ---"
          cat /tmp/bolt-collab.log || true
          echo "--- app ---"
          cat /tmp/bolt-app.log || true

      - name: Stop local runtime stack
        if: always()
        run: |
          kill $(cat /tmp/bolt-runtime.pid) 2>/dev/null || true
          kill $(cat /tmp/bolt-collab.pid) 2>/dev/null || true
          kill $(cat /tmp/bolt-app.pid) 2>/dev/null || true
