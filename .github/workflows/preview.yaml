name: Preview Deployment

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]
    branches: [main]

# Cancel in-progress runs on the same PR
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  deployments: write

jobs:
  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    # Draft reliability/security checkpoints must run CI without publishing an app.
    if: github.event.action != 'closed' && github.event.pull_request.draft == false

    steps:
      - name: Check if preview deployment is configured
        id: check-secrets
        run: |
          if [[ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" && -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]]; then
            echo "configured=true" >> $GITHUB_OUTPUT
          else
            echo "configured=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout
        if: steps.check-secrets.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Setup and Build
        if: steps.check-secrets.outputs.configured == 'true'
        uses: ./.github/actions/setup-and-build

      - name: Deploy to Cloudflare Pages
        if: steps.check-secrets.outputs.configured == 'true'
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          NO_COLOR: '1'
        run: |
          set -o pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
          deploy_log="$(mktemp)"
          pnpm exec wrangler pages deploy build/client \
            --project-name bolt-gives-preview \
            --branch "pr-$PR_NUMBER" \
            --commit-hash "$PR_HEAD_SHA" \
            --commit-message "Preview PR $PR_NUMBER" \
            --commit-dirty=false | tee "$deploy_log"
          deployment_url="$(grep -Eo 'https://[a-z0-9-]+\.bolt-gives-preview\.pages\.dev' "$deploy_log" | tail -n 1)"
          if [[ -z "$deployment_url" ]]; then
            echo "Wrangler did not report a preview deployment URL." >&2
            exit 1
          fi
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Run smoke tests on preview
        if: steps.check-secrets.outputs.configured == 'true'
        env:
          PREVIEW_DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          for attempt in $(seq 1 24); do
            if curl --connect-timeout 10 --max-time 20 -fLsS "$PREVIEW_DEPLOY_URL" -o /tmp/preview.html &&
              grep -q "bolt.gives" /tmp/preview.html; then
              echo "Preview deployment is ready: $PREVIEW_DEPLOY_URL"
              exit 0
            fi
            sleep 5
          done
          echo "Preview deployment did not become ready: $PREVIEW_DEPLOY_URL" >&2
          exit 1

      - name: Preview deployment not configured
        if: steps.check-secrets.outputs.configured == 'false'
        run: |
          echo "✅ Preview deployment is not configured for this repository"
          echo "To enable preview deployments, add the following secrets:"
          echo "- CLOUDFLARE_API_TOKEN"
          echo "- CLOUDFLARE_ACCOUNT_ID"
          echo "This is optional and the workflow will pass without it."
          echo "url=https://preview-not-configured.example.com" >> $GITHUB_OUTPUT

      - name: Add preview URL comment to PR
        uses: actions/github-script@v7
        continue-on-error: true
        env:
          PREVIEW_CONFIGURED: ${{ steps.check-secrets.outputs.configured }}
          PREVIEW_DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          PREVIEW_SHA: ${{ github.sha }}
        with:
          script: |
            const isConfigured = process.env.PREVIEW_CONFIGURED === 'true';
            const deployUrl = process.env.PREVIEW_DEPLOY_URL || 'https://preview-not-configured.example.com';
            const commitSha = process.env.PREVIEW_SHA || context.sha;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const previewComment = comments.find(comment => 
              comment.body.includes('🚀 Preview deployment')
            );

            let commentBody;
            if (isConfigured) {
              commentBody = `🚀 Preview deployment is ready!

              | Name | Link |
              |------|------|
              | Latest commit | ${commitSha} |
              | Preview URL | ${deployUrl} |

              Built with ❤️ by [bolt.gives](https://bolt.gives)
              `;
            } else {
              commentBody = `ℹ️ Preview deployment not configured

              | Name | Info |
              |------|------|
              | Latest commit | ${commitSha} |
              | Status | Preview deployment requires Cloudflare secrets |

              To enable preview deployments, repository maintainers can add:
              - \`CLOUDFLARE_API_TOKEN\` secret
              - \`CLOUDFLARE_ACCOUNT_ID\` secret

              Built with ❤️ by [bolt.gives](https://bolt.gives)
              `;
            }

            if (previewComment) {
              github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previewComment.id,
                body: commentBody
              });
            } else {
              github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody
              });
            }

      - name: Preview workflow summary
        run: |
          echo "✅ Preview deployment workflow completed successfully"
          if [[ "${{ steps.check-secrets.outputs.configured }}" == "true" ]]; then
            echo "🚀 Preview deployed to: ${{ steps.deploy.outputs.url }}"
          else
            echo "ℹ️ Preview deployment not configured (this is normal)"
          fi

  cleanup-preview:
    name: Cleanup Preview
    runs-on: ubuntu-latest
    if: github.event.action == 'closed'

    steps:
      - name: Delete preview environment
        uses: actions/github-script@v7
        continue-on-error: true
        env:
          PREVIEW_PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          script: |
            const prNumber = process.env.PREVIEW_PR_NUMBER;
            if (!prNumber) {
              core.warning('Missing PR number for cleanup');
              return;
            }

            const deployments = await github.rest.repos.listDeployments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              environment: `preview-pr-${prNumber}`,
            });

            for (const deployment of deployments.data) {
              await github.rest.repos.createDeploymentStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: deployment.id,
                state: 'inactive',
              });
            }

      - name: Remove preview comment
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            for (const comment of comments) {
              if (comment.body.includes('🚀 Preview deployment')) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: comment.id,
                });
              }
            }
